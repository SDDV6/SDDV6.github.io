name: keepalive-supabase

# But : empêcher la mise en veille du projet Supabase (gratuit → pause après ~7 jours
# d'inactivité). Une simple LECTURE ne suffit plus : le projet a été mis en pause le
# 14/09/2026 alors que ce ping tournait. On fait donc chaque jour une vraie ÉCRITURE
# (mise à jour de la ligne unique de la table "keepalive") + une lecture des photos.
# En plus, une tâche pg_cron interne à Supabase ("keepalive-interne") écrit toutes les 6 h.
#
# Filet de sécurité : si malgré tout le projet est en pause, on le RÉACTIVE tout seul
# via l'API de gestion Supabase. Il faut pour ça le secret GitHub SUPABASE_ACCESS_TOKEN
# (jeton personnel créé sur supabase.com/dashboard/account/tokens). Sans ce secret,
# l'étape est simplement sautée.
#
# Le workflow commit aussi un petit horodatage pour que GitHub ne le désactive PAS
# (GitHub coupe les workflows planifiés après 60 jours sans activité du dépôt).

on:
  schedule:
    - cron: '17 6 * * *'     # tous les jours à 06:17 UTC
  workflow_dispatch:          # bouton "Run workflow" dans l'onglet Actions (test manuel)

permissions:
  contents: write

env:
  SUPABASE_REF: fupekhowetudiaglbuiz
  SUPABASE_URL: https://fupekhowetudiaglbuiz.supabase.co
  # clé "anon public" — sans danger d'être publique
  SUPABASE_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1cGVraG93ZXR1ZGlhZ2xidWl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NDkwODEsImV4cCI6MjA5NzUyNTA4MX0.XW7zY72WI6UnBuhE4_wUplSh-Ma3aq93u3eo2WTD77c

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Récupère le dépôt
        uses: actions/checkout@v4

      - name: Réactive le projet s'il est en pause
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Secret SUPABASE_ACCESS_TOKEN absent : pas de réactivation automatique possible."
            exit 0
          fi
          API="https://api.supabase.com/v1/projects/$SUPABASE_REF"
          statut() { curl -fsS -H "Authorization: Bearer $TOKEN" "$API" | jq -r .status; }
          S=$(statut)
          echo "Statut du projet : $S"
          if [ "$S" = "INACTIVE" ]; then
            echo "::warning::Projet en pause → réactivation automatique"
            curl -fsS -X POST -H "Authorization: Bearer $TOKEN" "$API/restore"
            echo ""
          fi
          # Attend (max ~15 min) que le projet soit de nouveau en ligne
          for i in $(seq 1 90); do
            S=$(statut)
            [ "$S" = "ACTIVE_HEALTHY" ] && { echo "Projet actif"; exit 0; }
            echo "… $S"; sleep 10
          done
          echo "::error::Le projet n'est pas revenu en ligne (statut : $S)"
          exit 1

      - name: Réveille la base Supabase (écriture + lecture)
        run: |
          H1="apikey: $SUPABASE_ANON"
          H2="Authorization: Bearer $SUPABASE_ANON"
          curl -fsS --retry 5 --retry-delay 30 --retry-all-errors -X PATCH -H "$H1" -H "$H2" \
            -H "Content-Type: application/json" -H "Prefer: return=representation" \
            "$SUPABASE_URL/rest/v1/keepalive?id=eq.1" \
            -d "{\"pinged_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"source\":\"github\"}"
          echo ""
          curl -fsS --retry 5 --retry-delay 30 --retry-all-errors -H "$H1" -H "$H2" \
            "$SUPABASE_URL/rest/v1/uploads?select=id&order=id.desc&limit=5"
          echo ""
          echo "Ping Supabase OK"

      - name: Garde ce workflow actif (horodatage)
        if: always()
        run: |
          mkdir -p .github
          date -u > .github/last-keepalive.txt
          git config user.name  "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/last-keepalive.txt
          git commit -m "keepalive $(date -u +%Y-%m-%d)" || echo "rien a committer"
          git push || echo "push ignore"
